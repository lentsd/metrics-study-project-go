name: go vet test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  statictest:
    runs-on: ubuntu-latest
    container: golang:1.27
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build statictest with current Go version
        run: |
          GOBIN=/usr/local/bin go install github.com/Yandex-Practicum/go-autotests/cmd/statictest@latest

      - name: Run statictest
        run: |
          go vet -vettool=$(which statictest) ./...
